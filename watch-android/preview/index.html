<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ウォッチ実機プレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0f;color:#f3f5f9;font-family:system-ui,sans-serif;text-align:center}main{max-width:650px;margin:auto;padding:12px}h1{font-size:16px;margin:0 0 8px}p{font-size:12px;color:#a0aebe;margin:6px}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}button{color:inherit;border:1px solid #617285;background:#0f141b;padding:10px 14px;font:inherit;cursor:pointer;border-radius:0}#screen{display:block;width:min(100%,520px);aspect-ratio:1;object-fit:contain;margin:auto;touch-action:none;border-radius:50%;user-select:none;background:#000}#status{min-height:2em}label{font-size:12px}button:disabled{opacity:.5}
</style><main><h1>ウォッチ実機プレビュー</h1><p>接続中の時計の画面をそのまま表示します。クリック・ドラッグで操作できます。</p><nav><button data-action="wake">画面を点灯</button><button data-action="open">アプリを開く</button><button data-action="back">戻る</button><button id="pause">表示を一時停止</button></nav><img id="screen" alt="接続中のウォッチ画面" draggable="false"><p id="status" role="status">接続中…</p><p>表示は約1秒ごとに更新されます。入力操作は時計とFirebaseにも反映されます。</p></main>
<script>
const screen=document.querySelector('#screen'),status=document.querySelector('#status');let paused=false,down=null,lastUrl;
async function frame(){try{if(paused||document.hidden)return;const response=await fetch('/frame.png');if(!response.ok)throw new Error((await response.json()).error);const url=URL.createObjectURL(await response.blob());screen.src=url;if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=url;status.textContent='実機を表示中';}catch(error){status.textContent=error.message;}}
async function input(action,coordinates={}){try{const response=await fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...coordinates})});if(!response.ok)throw new Error((await response.json()).error);await frame();}catch(error){status.textContent=error.message;}}
document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>input(button.dataset.action));document.querySelector('#pause').onclick=event=>{paused=!paused;event.target.textContent=paused?'表示を再開':'表示を一時停止';if(!paused)frame();};
function point(event){const r=screen.getBoundingClientRect();return{x:Math.round((event.clientX-r.left)/r.width*screen.naturalWidth),y:Math.round((event.clientY-r.top)/r.height*screen.naturalHeight)}}
screen.onpointerdown=event=>{if(!screen.naturalWidth)return;down=point(event);screen.setPointerCapture(event.pointerId);};screen.onpointerup=event=>{if(!down)return;const end=point(event),start=down;down=null;if(Math.hypot(start.x-end.x,start.y-end.y)>10)input('swipe',{...start,x2:end.x,y2:end.y});else input('tap',start);};screen.onpointercancel=()=>{down=null;};
async function loop(){await frame();setTimeout(loop,1000);}loop();
</script></html>
